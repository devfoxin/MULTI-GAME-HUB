<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <h2>🕹️ ArcadeHub</h2>
            <nav>
                <button class="nav-btn active" onclick="switchScreen('home')">Home</button>
                <button class="nav-btn" onclick="switchScreen('tictactoe')">Tic-Tac-Toe</button>
                <button class="nav-btn" disabled>More Coming Soon!</button>
            </nav>
        </aside>

        <main class="main-content">
            
            <section id="home-screen" class="screen active">
                <h1>Welcome to the Game Hub!</h1>
                <p>Select a game from the sidebar to start playing.</p>
                <div class="game-cards">
                    <div class="card" onclick="switchScreen('tictactoe')">
                        <h3>Tic-Tac-Toe</h3>
                        <p>Classic 3x3 grid alignment game.</p>
                        <button class="play-btn">Play Now</button>
                    </div>
                </div>
            </section>

            <section id="tictactoe-screen" class="screen">
                <h1>Tic-Tac-Toe</h1>
                <div class="status-action-row">
                    <div id="status">Player X's turn</div>
                    <button id="reset-btn">Reset Game</button>
                </div>
                <div class="board">
                    <div class="cell" data-index="0"></div>
                    <div class="cell" data-index="1"></div>
                    <div class="cell" data-index="2"></div>
                    <div class="cell" data-index="3"></div>
                    <div class="cell" data-index="4"></div>
                    <div class="cell" data-index="5"></div>
                    <div class="cell" data-index="6"></div>
                    <div class="cell" data-index="7"></div>
                    <div class="cell" data-index="8"></div>
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
